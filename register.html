<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Register | Kid's Love Portal
</title>


<link rel="stylesheet" href="css/portal.css">


</head>


<body>


<div class="login-box">


<h1>
Create Account
</h1>



<input 
type="text" 
id="name"
placeholder="Full Name">



<input 
type="email" 
id="email"
placeholder="Email Address">



<input 
type="tel"
id="phone"
placeholder="Phone Number">



<input 
type="password"
id="password"
placeholder="Password">



<select id="role">


<option value="parent">
Parent
</option>


<option value="teacher">
Teacher
</option>


</select>



<!-- Only for parents -->

<input 
type="text"
id="child"
placeholder="Child Name (Parents Only)">





<button onclick="registerUser()">

Register

</button>




<p>

Already have an account?

<a href="portal.html">

Login

</a>

</p>



</div>




<script src="js/register.js"></script>


</body>

</html>
