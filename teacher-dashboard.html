<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Teacher Dashboard | Kid's Love Nursery
</title>

<link rel="stylesheet" href="teacher.css">

</head>


<body>


<header>

<h2>
Kid's Love Teacher Portal
</h2>


<button onclick="logout()">
Logout
</button>


</header>



<section class="welcome">

<h1>
Welcome, <span id="teacherName"></span>
</h1>

<p>
Teacher Dashboard
</p>

</section>





<section class="dashboard">



<!-- TEACHER PROFILE -->

<div class="card">

<h2>
Teacher Profile
</h2>


<p>
Name:
<span id="name"></span>
</p>


<p>
Email:
<span id="email"></span>
</p>


<p>
Phone:
<span id="phone"></span>
</p>


</div>






<!-- STUDENTS -->

<div class="card">


<h2>
Students
</h2>


<div id="students">

Loading students...

</div>


</div>







<!-- ATTENDANCE -->

<div class="card">


<h2>
Attendance
</h2>


<input 
id="studentName"
placeholder="Student Name">


<select id="status">

<option>
Present
</option>

<option>
Absent
</option>

</select>


<button onclick="saveAttendance()">

Save Attendance

</button>


</div>








<!-- RESULTS -->

<!-- RESULTS -->

<div class="card">

<h2>
📊 Add Student Results
</h2>


<input 
id="resultStudent"
placeholder="Student Name">


<input 
id="subject"
placeholder="Subject">


<input 
id="marks"
placeholder="Marks (%)">


<textarea
id="comment"
placeholder="Teacher comment">
</textarea>


<button onclick="saveResult()">

Save Result

</button>


</div>





</section>



<script src="teacher.js"></script>


</body>

</html>
